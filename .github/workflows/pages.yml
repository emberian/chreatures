name: Publish project notebook

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/articulated-garden.png"
      - "docs/assets/hollow-garden.png"
      - "docs/assets/learning-garden.png"
      - "docs/assets/terrarium-garden.png"
      - "web/vendor/three/three.module.min.js"
      - "web/vendor/three/three.core.min.js"
      - "web/vendor/three/OrbitControls.js"
      - "web/vendor/three/LICENSE"
      - "web/vendor/three/VERSION"
      - "scripts/build_pages.py"
      - "scripts/check_live_module_graph.mjs"
      - "scripts/pages_release_bundle.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Fetch authenticated release inputs
        id: release
        run: >-
          python3 scripts/pages_release_bundle.py fetch
          --selection site/live/release-selection.json
          --output "$RUNNER_TEMP/chreatures-pages-input"
          --github-output "$GITHUB_OUTPUT"
      - name: Build public notebook artifact
        run: >-
          python3 scripts/build_pages.py
          --revision "$GITHUB_SHA"
          --model-directory "${{ steps.release.outputs.model_directory }}"
          --runtime-directory "${{ steps.release.outputs.runtime_directory }}"
          --expected-runtime-manifest-sha256 "${{ steps.release.outputs.runtime_manifest_sha256 }}"
          --physics-directory "${{ steps.release.outputs.physics_directory }}"
          --expected-physics-manifest-sha256 "${{ steps.release.outputs.physics_manifest_sha256 }}"
          --model-training-status "${{ steps.release.outputs.training_status }}"
          --expected-model-release-sha256 "${{ steps.release.outputs.model_release_sha256 }}"
      - name: Link the published browser entry modules headlessly
        run: node --experimental-vm-modules scripts/check_live_module_graph.mjs dist/site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
