[package]
name = "chreatures-browser-world"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chreatures-ecology-core = { path = "../ecology-core" }
chreatures-fly-aerodynamics = { path = "../fly-aerodynamics" }
[profile.release]
opt-level = 3
lto = true
