[package]
name = "chreatures-ecology-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Conservative native ecology kernel for Chreatures physical hosts"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

