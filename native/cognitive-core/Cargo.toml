[package]
name = "chreatures-cognitive-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "_cognitive_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python", "accelerate"]
python = ["dep:numpy", "dep:pyo3"]
accelerate = []

[dependencies]
matrixmultiply = "0.3.10"
numpy = { version = "0.28", optional = true }
pyo3 = { version = "0.28.3", features = ["extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
