[package]
name = "chreatures-resident-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "resident_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
chreatures-cognitive-core = { path = "../cognitive-core", default-features = false }
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
